<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>誤解之神</title>
  <meta name="description" content="你是神，但人類永遠不懂你。一款看著文明演化的上帝遊戲。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">誤解之神 <span id="worldName" class="muted"></span></div>
    <div class="time"><span id="year"></span><span id="eraBadge" class="badge"></span></div>
    <div class="speed" id="speed" title="空白鍵：暫停／繼續">
      <button data-speed="0">⏸</button>
      <button data-speed="1">1×</button>
      <button data-speed="3">3×</button>
      <button data-speed="10">10×</button>
    </div>
    <div class="menu">
      <button id="btnCodex">📖 圖鑑</button>
      <button id="btnHelp">❔ 說明</button>
      <button id="btnNew">🌍 新世界</button>
    </div>
  </header>

  <main>
    <section class="left">
      <div class="mapwrap" id="mapwrap">
        <canvas id="map" width="960" height="608"></canvas>
        <div id="targetHint" class="hint hidden"></div>
        <div id="tooltip" class="tooltip hidden"></div>
        <div id="toast" class="toast hidden"></div>
      </div>
      <div class="panel chronicle">
        <h3>📜 編年史</h3>
        <div id="log"></div>
      </div>
    </section>

    <aside class="right">
      <div class="panel">
        <h3>文明</h3>
        <div id="stats"></div>
      </div>
      <div class="panel">
        <h3>奇蹟 <span id="faithLabel" class="faith"></span></h3>
        <div class="faithbar"><div id="faithFill"></div></div>
        <div id="miracles" class="miracles"></div>
        <div id="miracleInfo" class="minfo">把滑鼠移到奇蹟上查看說明。</div>
      </div>
      <div class="panel">
        <h3>🌳 研究</h3>
        <div id="research"></div>
      </div>
      <div class="panel">
        <h3>部族</h3>
        <div id="tribes"></div>
      </div>
    </aside>
  </main>

  <div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>

  <script src="js/data.js"></script>
  <script src="js/sim.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
